name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Executar testes
        run: npm test -- --watch=false

      - name: Gerar build de produção
        run: npm run build:prod

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fcl-gestao/backend
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      JWT_SECRET_KEY: chave-segura-apenas-para-ci-do-sistema-fcl
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: fcl-gestao/backend/requirements-test.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-test.txt

      - name: Executar testes
        run: python -m unittest discover -s tests -v
